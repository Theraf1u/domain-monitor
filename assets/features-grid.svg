<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#111122"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb4" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="50"/></filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="160" fill="url(#orb1)" filter="url(#blurBig)"/>
  <circle cx="880" cy="120" r="160" fill="url(#orb2)" filter="url(#blurBig)"/>
  <circle cx="120" cy="480" r="160" fill="url(#orb3)" filter="url(#blurBig)"/>
  <circle cx="880" cy="480" r="160" fill="url(#orb4)" filter="url(#blurBig)"/>
  <circle cx="500" cy="300" r="200" fill="url(#orb1)" filter="url(#blurBig)" opacity="0.5"/>

  <text x="500" y="52" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff">Разделы бота</text>

  <!-- 3x2 grid of glass cards -->
  <g font-family="-apple-system, sans-serif">
    <!-- row 1 -->
    <g>
      <rect x="60" y="90" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="90" y="145" font-size="34">📡</text>
      <text x="90" y="185" font-size="19" font-weight="700" fill="#ffffff">Ноды</text>
      <text x="90" y="210" font-size="13" fill="#9fb0d8">Поиск, фильтры, массовые</text>
      <text x="90" y="230" font-size="13" fill="#9fb0d8">действия, телеметрия</text>
      <text x="90" y="250" font-size="13" fill="#9fb0d8">агента в реальном времени</text>
    </g>

    <g>
      <rect x="365" y="90" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="395" y="145" font-size="34">🌐</text>
      <text x="395" y="185" font-size="19" font-weight="700" fill="#ffffff">Домены</text>
      <text x="395" y="210" font-size="13" fill="#9fb0d8">Поиск, история, карточка</text>
      <text x="395" y="230" font-size="13" fill="#9fb0d8">домена, CSV/JSON/TXT</text>
      <text x="395" y="250" font-size="13" fill="#9fb0d8">экспорт</text>
    </g>

    <g>
      <rect x="670" y="90" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="700" y="145" font-size="34">📊</text>
      <text x="700" y="185" font-size="19" font-weight="700" fill="#ffffff">Статистика</text>
      <text x="700" y="210" font-size="13" fill="#9fb0d8">Единые периоды, сравнение</text>
      <text x="700" y="230" font-size="13" fill="#9fb0d8">с прошлым, source</text>
      <text x="700" y="250" font-size="13" fill="#9fb0d8">distribution</text>
    </g>

    <!-- row 2 -->
    <g>
      <rect x="60" y="300" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="90" y="355" font-size="34">🔔</text>
      <text x="90" y="395" font-size="19" font-weight="700" fill="#ffffff">Уведомления</text>
      <text x="90" y="420" font-size="13" fill="#9fb0d8">Per-event toggles, batch,</text>
      <text x="90" y="440" font-size="13" fill="#9fb0d8">тихие часы, тест</text>
      <text x="90" y="460" font-size="13" fill="#9fb0d8">доставки</text>
    </g>

    <g>
      <rect x="365" y="300" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="395" y="355" font-size="34">🧰</text>
      <text x="395" y="395" font-size="19" font-weight="700" fill="#ffffff">Фильтры</text>
      <text x="395" y="420" font-size="13" fill="#9fb0d8">Ignore/Allow/Watch,</text>
      <text x="395" y="440" font-size="13" fill="#9fb0d8">массовый импорт/экспорт,</text>
      <text x="395" y="460" font-size="13" fill="#9fb0d8">проверка домена</text>
    </g>

    <g>
      <rect x="670" y="300" width="270" height="190" rx="26" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="700" y="355" font-size="34">💾</text>
      <text x="700" y="395" font-size="19" font-weight="700" fill="#ffffff">Бэкапы</text>
      <text x="700" y="420" font-size="13" fill="#9fb0d8">Checksum, verify,</text>
      <text x="700" y="440" font-size="13" fill="#9fb0d8">pre-restore снэпшот,</text>
      <text x="700" y="460" font-size="13" fill="#9fb0d8">авто-откат</text>
    </g>
  </g>

  <text x="500" y="530" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#7f93c4" opacity="0.8">+ ⚙️ Настройки, 🚚 Миграция, 🩺 Диагностика, 🔄 Обновления</text>
</svg>
