<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="55%" stop-color="#0c0c17"/>
      <stop offset="100%" stop-color="#101020"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdd9ff"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="70" y="60" width="1060" height="300" rx="36"/></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- blurred light orbs, symmetric around the panel -->
  <circle cx="150" cy="70" r="170" fill="url(#orbBlue)" filter="url(#blurBig)"/>
  <circle cx="1050" cy="70" r="170" fill="url(#orbPurple)" filter="url(#blurBig)"/>
  <circle cx="600" cy="420" r="220" fill="url(#orbCyan)" filter="url(#blurBig)"/>

  <!-- main glass panel, centered in the canvas -->
  <rect x="70" y="60" width="1060" height="300" rx="36" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
  <g clip-path="url(#cardClip)">
    <rect x="70" y="60" width="1060" height="3" fill="url(#sheen)"/>
  </g>

  <!-- content block, centered both horizontally (x=600) and vertically inside the panel -->
  <g text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif">
    <text x="600" y="168" font-size="48" font-weight="700" fill="url(#titleGrad)" letter-spacing="-0.5">Domain Monitor</text>

    <text x="600" y="212" font-size="21" font-weight="500" fill="#e2e7f7">Понять, с какими доменами общаются приложения на ноде —</text>
    <text x="600" y="240" font-size="21" font-weight="500" fill="#e2e7f7">и пустить нужные из них в обход VPN, напрямую</text>

    <!-- purpose pill, width sized to fit its own text, centered -->
    <g transform="translate(600,278)">
      <rect x="-235" y="-21" width="470" height="42" rx="21" fill="url(#pillFill)" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="0" y="6" font-size="16" font-weight="600" fill="#dffbea">🇷🇺 whitelist-роутинг для российских сервисов</text>
    </g>

    <text x="600" y="325" font-size="14" fill="#8fa0cc" opacity="0.9">Ставится за пару минут на любую VPN-ноду · управление целиком в Telegram</text>
  </g>
</svg>
