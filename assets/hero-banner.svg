<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="55%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#111122"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bcd0ff"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="60" y="70" width="1080" height="260" rx="34"/></clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- blurred light orbs (the "liquid" refraction glow) -->
  <circle cx="180" cy="90" r="160" fill="url(#orbBlue)" filter="url(#blurBig)"/>
  <circle cx="1040" cy="330" r="190" fill="url(#orbPurple)" filter="url(#blurBig)"/>
  <circle cx="620" cy="360" r="150" fill="url(#orbCyan)" filter="url(#blurBig)"/>
  <circle cx="950" cy="60" r="120" fill="url(#orbCyan)" filter="url(#blurBig)"/>

  <!-- main glass panel -->
  <rect x="60" y="70" width="1080" height="260" rx="34" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.14"/>
  <g clip-path="url(#cardClip)">
    <rect x="60" y="70" width="1080" height="3" fill="url(#sheen)"/>
    <ellipse cx="260" cy="90" rx="260" ry="40" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- little node dots top-right, echoing the multi-node theme -->
  <g opacity="0.85">
    <circle cx="1000" cy="130" r="5" fill="#34d399"/>
    <circle cx="1030" cy="150" r="5" fill="#34d399"/>
    <circle cx="1000" cy="170" r="5" fill="#f59e0b"/>
    <circle cx="1060" cy="120" r="5" fill="#34d399"/>
    <line x1="1000" y1="130" x2="1030" y2="150" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1030" y1="150" x2="1000" y2="170" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="1030" y1="150" x2="1060" y2="120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <text x="110" y="185" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="url(#titleGrad)" letter-spacing="-1">Domain Monitor</text>
  <text x="110" y="235" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#8fa3d1" letter-spacing="0.5">2.0</text>
  <text x="110" y="285" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="21" fill="#c3cbe6" opacity="0.85">Мультинодовый центр управления VPN-мониторингом — целиком в Telegram</text>
</svg>
