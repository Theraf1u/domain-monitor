services:
  agent:
    build: .
    image: domain-monitor-agent:latest
    container_name: domain-monitor-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    volumes:
      - ./data:/data
    # Hard ceiling regardless of capture volume - tshark on a busy node can
    # grow well beyond what any tuning fully bounds. If it ever hits this,
    # Docker kills and restarts *this container* instead of the packet
    # capture starving the whole host (which is what a VPN node running
    # actual paying traffic cannot afford). Raise if you have room to
    # spare; the important thing is that it's never "unlimited".
    mem_limit: ${AGENT_MEM_LIMIT:-1g}
    cpus: ${AGENT_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/data/agent_buffer.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
