services:
  agent:
    build: .
    image: domain-monitor-agent:latest
    container_name: domain-monitor-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/data/agent_buffer.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
