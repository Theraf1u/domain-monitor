<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Первичная настройка — Domain Monitor</title>
  <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box" style="width:360px">
      <h1>🖥 Первичная настройка</h1>
      <p class="muted">Создайте аккаунт владельца (Owner) — первого администратора Web Admin.</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/setup">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-row">
          <label>Логин</label>
          <input type="text" name="username" autofocus required style="width:100%">
        </div>
        <div class="form-row">
          <label>Пароль (мин. 8 символов)</label>
          <input type="password" name="password" required minlength="8" style="width:100%">
        </div>
        <div class="form-row">
          <label>Повторите пароль</label>
          <input type="password" name="password2" required minlength="8" style="width:100%">
        </div>
        <button class="btn" type="submit" style="width:100%">Создать аккаунт</button>
      </form>
    </div>
  </div>
</body>
</html>
