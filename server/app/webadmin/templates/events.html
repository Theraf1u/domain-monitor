{% extends "base.html" %}
{% block title %}Live Events — Domain Monitor{% endblock %}
{% block content %}
<h1>Live Events <span id="ws-status" class="muted" style="font-size:12px;"></span></h1>
<div id="live-events"></div>

<script>
(function () {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const statusEl = document.getElementById("ws-status");
  const list = document.getElementById("live-events");
  const MAX_ROWS = 500;

  function connect() {
    const ws = new WebSocket(proto + "//" + location.host + "/admin/ws/events");
    ws.onopen = () => { statusEl.textContent = "● connected"; };
    ws.onclose = () => { statusEl.textContent = "○ disconnected, retrying..."; setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const row = document.createElement("div");
      const time = new Date(data.occurred_at).toLocaleTimeString();
      row.textContent = `${time}  ${data.domain}  [${data.node}]`;
      list.prepend(row);
      while (list.children.length > MAX_ROWS) list.removeChild(list.lastChild);
    };
  }
  connect();
})();
</script>
{% endblock %}
