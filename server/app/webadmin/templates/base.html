<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Domain Monitor{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/style.css">
  <script src="/admin/static/htmx.min.js"></script>
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <div class="brand">🖥 Domain Monitor</div>
      <nav>
        <a href="/admin/" class="{{ 'active' if active == 'dashboard' else '' }}">Dashboard</a>
        <a href="/admin/nodes" class="{{ 'active' if active == 'nodes' else '' }}">Nodes</a>
        <a href="/admin/domains" class="{{ 'active' if active == 'domains' else '' }}">Domains</a>
        <a href="/admin/filters" class="{{ 'active' if active == 'filters' else '' }}">Filters</a>
        <a href="/admin/events" class="{{ 'active' if active == 'events' else '' }}">Events (live)</a>
        <a href="/admin/settings" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
        {% if user and user.has_at_least('owner') %}
        <a href="/admin/users" class="{{ 'active' if active == 'users' else '' }}">Users</a>
        {% endif %}
      </nav>
      {% if user %}
      <div style="padding:16px;border-top:1px solid var(--border);margin-top:16px;">
        <div>{{ user.username }} <span class="pill {{ user.role }}">{{ user.role }}</span></div>
        <form method="post" action="/admin/logout" style="margin-top:8px;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn secondary" type="submit">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
