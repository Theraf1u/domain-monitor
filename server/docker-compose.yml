services:
  server:
    build: .
    image: domain-monitor-server:latest
    container_name: domain-monitor-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
